[project]
name = "ola-data-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohammad Raheem", email = "mohammadraheem359@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "ipython>=9.18.1",
    "langchain>=1.4.7",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.18",
    "pydantic>=2.14.2",
    "pyodbc>=5.3.0",
    "sqlglot>=30.30.0",
    "streamlit>=1.67.0",
]

[project.scripts]
ola-data-agent = "ola_data_agent:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
